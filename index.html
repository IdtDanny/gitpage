<!DOCTYPE html>
<html lang="en">
  <!-- TCP Test - Knowledge Check -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Knowledge Check · TCP/IP & Security</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f2f5fc;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      padding: 1rem 0.75rem 2.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .quiz-container {
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }

    /* header */
    .header {
      background: #0a1e3c;
      color: white;
      border-radius: 2rem 2rem 1rem 1rem;
      padding: 1.8rem 1.2rem 1.4rem;
      box-shadow: 0 10px 20px rgba(0, 15, 40, 0.2);
      margin-bottom: 1.2rem;
      text-align: center;
    }

    .header h1 {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.3rem;
      line-height: 1.2;
    }

    .header p {
      font-size: 1rem;
      opacity: 0.85;
      font-weight: 400;
      margin-top: 0.2rem;
    }

    .badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.15);
      padding: 0.3rem 1rem;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      margin-top: 0.8rem;
      backdrop-filter: blur(2px);
    }

    /* progress / score bar */
    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      border-radius: 50px;
      padding: 0.75rem 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.03);
      border: 1px solid #e4eaf2;
      font-weight: 500;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    .stats-bar span {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      color: #1f2b48;
    }

    .score-badge {
      background: #e8f0fe;
      padding: 0.3rem 1rem;
      border-radius: 40px;
      color: #0a1e3c;
      font-weight: 600;
    }

    /* question card */
    .question-card {
      background: white;
      border-radius: 1.5rem;
      padding: 1.6rem 1.3rem 1.3rem;
      margin-bottom: 1.2rem;
      box-shadow: 0 8px 16px -6px rgba(0, 20, 40, 0.08);
      border: 1px solid #e9eef5;
      transition: box-shadow 0.2s;
    }

    .question-card:active {
      box-shadow: 0 4px 10px -4px rgba(0, 20, 40, 0.1);
    }

    .q-header {
      display: flex;
      gap: 0.6rem;
      margin-bottom: 0.9rem;
      align-items: flex-start;
    }

    .q-num {
      background: #0a1e3c;
      color: white;
      font-weight: 700;
      font-size: 0.9rem;
      border-radius: 30px;
      padding: 0.2rem 0.8rem;
      flex-shrink: 0;
      margin-top: 0.1rem;
    }

    .q-text {
      font-weight: 600;
      font-size: 1.05rem;
      line-height: 1.45;
      color: #0f1c33;
      flex: 1;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      margin: 1rem 0 0.9rem;
    }

    .option {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      background: #f8fafd;
      border: 1.5px solid #dee6f0;
      border-radius: 1rem;
      padding: 0.85rem 1rem;
      cursor: pointer;
      transition: all 0.15s ease;
      font-size: 0.96rem;
      line-height: 1.4;
      color: #1e2b44;
    }

    .option:hover {
      background: #eef3fd;
      border-color: #b8cbe0;
    }

    .option.selected {
      background: #e2ecfe;
      border-color: #0a1e3c;
      box-shadow: 0 0 0 1px #0a1e3c;
    }

    .option.correct {
      background: #d7f0e0;
      border-color: #1f8b4c;
      box-shadow: 0 0 0 1px #1f8b4c;
    }

    .option.wrong {
      background: #ffe5e7;
      border-color: #c22b3a;
      box-shadow: 0 0 0 1px #c22b3a;
    }

    .option-letter {
      font-weight: 700;
      background: white;
      border-radius: 30px;
      width: 1.7rem;
      height: 1.7rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1px solid #cbd5e3;
      color: #14213b;
      font-size: 0.9rem;
    }

    .option.selected .option-letter {
      background: #0a1e3c;
      color: white;
      border-color: #0a1e3c;
    }

    .option.correct .option-letter {
      background: #1f8b4c;
      color: white;
      border-color: #1f8b4c;
    }

    .option.wrong .option-letter {
      background: #c22b3a;
      color: white;
      border-color: #c22b3a;
    }

    /* feedback & explanation */
    .feedback {
      margin-top: 0.8rem;
      padding: 0.8rem 1rem;
      border-radius: 1rem;
      font-size: 0.9rem;
      line-height: 1.5;
      background: #f4f7fc;
      border-left: 5px solid #a0b8d4;
      color: #1e2e4a;
      display: none;
    }

    .feedback.show {
      display: block;
    }

    .feedback.correct-fb {
      background: #e2f3e8;
      border-left-color: #1f8b4c;
      color: #0b3720;
    }

    .feedback.wrong-fb {
      background: #fde9eb;
      border-left-color: #c22b3a;
      color: #4e1420;
    }

    .feedback strong {
      font-weight: 700;
    }

    /* explanation inside feedback */
    .explanation {
      margin-top: 0.5rem;
      font-size: 0.88rem;
      color: inherit;
      opacity: 0.9;
      font-style: italic;
    }

    /* small reset / footer */
    .footer-actions {
      display: flex;
      justify-content: center;
      margin-top: 1.8rem;
      gap: 1rem;
    }

    .reset-btn {
      background: white;
      border: 2px solid #0a1e3c;
      color: #0a1e3c;
      padding: 0.8rem 2.2rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.03);
    }

    .reset-btn:hover {
      background: #0a1e3c;
      color: white;
    }

    .note {
      text-align: center;
      font-size: 0.8rem;
      color: #66738e;
      margin-top: 1.5rem;
    }

    /* mobile fine-tune */
    @media (max-width: 480px) {
      .header h1 {
        font-size: 1.5rem;
      }
      .q-text {
        font-size: 1rem;
      }
      .option {
        font-size: 0.92rem;
        padding: 0.8rem 0.8rem;
      }
      .question-card {
        padding: 1.2rem 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container">
    <div class="header">
      <h1>🧠 Knowledge Check</h1>
      <p>TCP/IP · Networking · Security</p>
      <div class="badge">20 MCQs · Scan & learn</div>
    </div>

    <div class="stats-bar">
      <span>📋 <span id="answered-count">0</span> / 20 answered</span>
      <span class="score-badge" id="score-display">✅ 0 correct</span>
    </div>

    <div id="quiz-root">
      <!-- questions injected via JavaScript -->
    </div>

    <div class="footer-actions">
      <button class="reset-btn" id="resetBtn">⟲ Reset quiz</button>
    </div>
    <div class="note">Tap an option to reveal answer & explanation</div>
  </div>

  <script>
    (function() {
      // ---------- QUESTION DATA (based on provided MCQs) ----------
      const questions = [
        {
          question: "Which core characteristic of TCP/IP allows it to operate uniformly across Ethernet, Wi-Fi, and fiber optic media without modifying upper-layer protocols?",
          options: [
            "Strict hardware-dependent routing tables",
            "Virtual network abstraction of underlying physical technologies",
            "Mandatory layer-2 MAC address propagation to the application layer",
            "Elimination of local network interfaces in favor of global tunnels"
          ],
          correct: 1,
          explanation: "TCP/IP deliberately abstracts from physical details of underlying network technologies, allowing identical communication patterns regardless of physical media."
        },
        {
          question: "In the context of the TCP/IP virtual network model, why is delivery across an internetwork described as \"parasitic\"?",
          options: [
            "It consumes excessive CPU cycles on end-hosts.",
            "It relies entirely on underlying local network communication mechanisms to perform actual physical data delivery.",
            "It requires constant malware payloads to maintain connection state.",
            "It bypasses routers by tunneling directly through switches."
          ],
          correct: 1,
          explanation: "Internetwork delivery is parasitic because actual physical delivery is performed by underlying local network technologies, not TCP/IP itself."
        },
        {
          question: "Why do intermediate routers need to maintain local addresses on every network segment to which they connect?",
          options: [
            "To encrypt packets before they leave the local broadcast domain",
            "To allow global delivery across an internetwork as a series of local deliveries",
            "To generate cryptographic keys for IPsec transport mode",
            "To prevent ARP poisoning attacks on adjacent switches"
          ],
          correct: 1,
          explanation: "Routers are physically connected to multiple networks and possess local addresses on each, enabling them to receive local frames and bridge traffic across different networks."
        },
        {
          question: "Which OSI/TCP-IP architectural principle dictates that error recovery and reliability functions should reside primarily in the end-hosts rather than intermediate routers?",
          options: [
            "The End-to-End Principle",
            "The Zero-Trust Architecture Principle",
            "The Principle of Least Privilege",
            "Protocol Ossification"
          ],
          correct: 0,
          explanation: "The End-to-End principle keeps intermediate routers lean and performant by leaving complex state management and error recovery to end-hosts."
        },
        {
          question: "Where is global addressing information stored when a packet is transmitted across a local Ethernet network segment?",
          options: [
            "In the preamble of the physical layer cable",
            "Inside the data portion (payload) of the local network frame",
            "In the L2 Ethernet header source field",
            "Directly inside the switch's CAM table"
          ],
          correct: 1,
          explanation: "Local frames have no native field for global addresses; therefore, global addressing information is encapsulated inside the data portion of the frame."
        },
        {
          question: "When a router processes an incoming packet during forwarding, what exact sequence of operations does it perform on the packet's headers?",
          options: [
            "It encrypts the L4 header and increments the L2 source MAC.",
            "It de-encapsulates the frame, inspects the global destination address, and re-encapsulates the data into a new frame with new local addresses.",
            "It modifies the global destination IP address to match the next router's local IP.",
            "It strips all IP headers and replaces them with TLS certificates."
          ],
          correct: 1,
          explanation: "Routers extract contents from frames, examine global destination addresses to determine the next hop, and re-encapsulate the data in a new frame with appropriate local addresses."
        },
        {
          question: "Which IPv4 header field is modified at every single router hop, mandating an immediate recalculation of the header checksum?",
          options: [
            "Total Length",
            "Time to Live (TTL)",
            "Protocol",
            "Source IP Address"
          ],
          correct: 1,
          explanation: "Because routers decrement the TTL by at least 1 at every hop to prevent routing loops, the header checksum must be recomputed."
        },
        {
          question: "An attacker injects forged ARP replies into a switched network. Which structural limitation of local network technologies enables this attack?",
          options: [
            "Lack of cryptographic authentication in the stateless ARP protocol",
            "Encryption failures at the TCP transport layer",
            "Global IP address collisions across subnets",
            "Misconfigured DNS root server delegation"
          ],
          correct: 0,
          explanation: "ARP is an unauthenticated, stateless protocol that maps L3 IPs to L2 MAC addresses without verifying message authenticity, allowing spoofing."
        },
        {
          question: "How does a receiving host know which higher-layer protocol (e.g., Internet layer vs. Transport layer) is being encapsulated within an incoming packet?",
          options: [
            "By querying a centralized cloud registry via DNS",
            "By reading protocol identifier fields embedded within the headers of each lower layer",
            "By analyzing the physical voltage fluctuations on the network cable",
            "By executing a brute-force decryption routine on the packet payload"
          ],
          correct: 1,
          explanation: "Lower-layer headers contain specific identifier fields (like EtherType or protocol numbers) that inform the receiver which higher-layer protocol is encapsulated inside."
        },
        {
          question: "What is the precise definition of \"De-multiplexing\" at a receiving host?",
          options: [
            "Combining multiple TCP streams into a single UDP datagram",
            "Identifying an upper-layer protocol from header fields, extracting the data, and transferring it to the appropriate software process",
            "Stripping IPsec encryption keys from incoming packets",
            "Dropping malformed frames at the network interface card"
          ],
          correct: 1,
          explanation: "De-multiplexing is the process where the host identifies, extracts, and routes upper-layer protocol data to the correct software handler."
        },
        {
          question: "Why does TCP/IP intentionally group Session and Presentation functions into the Application layer rather than defining separate L5/L6 layers like the OSI model?",
          options: [
            "To simplify protocol design and keep the core routing layers stateless and scalable",
            "Because encryption was forbidden in early ARPANET specifications",
            "To make packet header sizes fit exactly into 64-byte blocks",
            "To prevent developers from writing custom application software"
          ],
          correct: 0,
          explanation: "TCP/IP streamlines architecture by handling session/presentation concerns (like TLS) at the application or transport abstraction levels, keeping network core routing lean."
        },
        {
          question: "What vulnerability vector is exploited during a TCP SYN Flood attack against the Transport layer?",
          options: [
            "Exhaustion of application-layer database connection pools",
            "Exhaustion of kernel memory allocated for half-open connection queues (Transmission Control Blocks)",
            "Overflow of the physical Ethernet cable bandwidth",
            "Injection of malicious ICMP redirect frames"
          ],
          correct: 1,
          explanation: "SYN floods overwhelm the server's SYN queue with half-open connections, preventing legitimate handshakes from completing."
        },
        {
          question: "How do SYN Cookies mitigate TCP SYN Flood attacks without allocating kernel memory for initial handshake states?",
          options: [
            "By dropping all incoming packets from external IP subnets",
            "By encoding connection state cryptographically into the Initial Sequence Number (ISN) sent in the SYN-ACK",
            "By forcing clients to solve a proof-of-work puzzle using TLS certificates",
            "By switching all traffic immediately from TCP to stateless UDP"
          ],
          correct: 1,
          explanation: "SYN cookies compute a cryptographic hash of source/destination IPs, ports, and a secret seed to form the ISN, allocating memory only upon receiving a valid returning ACK."
        },
        {
          question: "What is the primary security advantage of QUIC (HTTP/3) encrypting its transport-layer control headers over traditional TCP?",
          options: [
            "It prevents middlebox protocol ossification and enables secure multiplexing without head-of-line blocking.",
            "It eliminates the need for IP addresses entirely.",
            "It forces routers to inspect every application payload in real-time.",
            "It prevents physical cable tapping by grounding electrical signals."
          ],
          correct: 0,
          explanation: "Encrypting transport headers in QUIC stops middleboxes from interfering with protocol evolution (ossification) and isolates packet loss per stream."
        },
        {
          question: "In Stateful Packet Inspection (SPI) firewalls, what components form the primary 5-tuple used to track connection state?",
          options: [
            "MAC source, MAC dest, VLAN ID, EtherType, TTL",
            "Source IP, Destination IP, Source Port, Destination Port, L4 Protocol",
            "Packet length, Checksum, Fragment offset, Window size, Sequence number",
            "SSID, BSSID, Signal strength, Channel frequency, Encryption type"
          ],
          correct: 1,
          explanation: "SPI firewalls evaluate the 5-tuple to correlate return traffic against established outbound connection states."
        },
        {
          question: "Why are UDP-based amplification attacks (e.g., DNS/NTP reflection) easier to execute than TCP-based amplification attacks?",
          options: [
            "UDP requires a mandatory 3-way handshake that verifies source IP ownership.",
            "UDP is stateless, allowing attackers to easily spoof source IP addresses in requests sent to reflector servers.",
            "UDP packets are automatically encrypted by network interface cards.",
            "UDP amplification relies on physical layer signal boosters."
          ],
          correct: 1,
          explanation: "Because UDP lacks a handshake, an attacker can spoof a victim's IP address as the source in a small request, causing servers to dump massive responses onto the victim."
        },
        {
          question: "What is the function of eBPF (Extended Berkeley Packet Filter) in modern high-performance Linux networking and security?",
          options: [
            "It replaces physical routers with wireless access points.",
            "It executes sandboxed security and filtering programs directly inside the kernel at the driver level before full stack demultiplexing.",
            "It generates automated RSA keys for BGP routing tables.",
            "It converts analog modem signals into digital fiber packets."
          ],
          correct: 1,
          explanation: "eBPF allows safe programs to run inside the kernel (e.g., XDP), inspecting and mitigating malicious traffic before standard socket allocation and stack processing overhead occur."
        },
        {
          question: "How does IPsec Tunnel Mode differ from Transport Mode regarding packet structure and header protection?",
          options: [
            "Tunnel mode encrypts only the L4 payload while keeping original IP headers exposed.",
            "Tunnel mode encrypts the entire original IP datagram and encapsulates it inside a brand-new outer IP header.",
            "Tunnel mode replaces Ethernet frames with Bluetooth signals.",
            "Tunnel mode operates exclusively at the Application layer."
          ],
          correct: 1,
          explanation: "In Tunnel mode, the whole IP packet is encrypted and placed inside a new IP wrapper, hiding the original source and destination routing topology."
        },
        {
          question: "What security vulnerability does RFC 5961 specifically address in modern TCP protocol stacks?",
          options: [
            "Blind TCP Reset (RST) injection attacks that tear down active sessions using loose sequence number acceptance.",
            "Buffer overflows in web browser JavaScript engines.",
            "SQL injection vulnerabilities in HTTP header parsing.",
            "Password guessing attacks against SSH daemons."
          ],
          correct: 0,
          explanation: "RFC 5961 tightens the acceptance window for RST packets, requiring exact sequence number matches (RCV.NXT) to prevent blind session teardowns."
        },
        {
          question: "Why does DNS over HTTPS (DoH) pose a significant challenge for traditional enterprise network security monitoring (NSM)?",
          options: [
            "It converts all DNS text queries into unreadable binary machine code.",
            "It encapsulates plaintext DNS queries inside encrypted TLS sessions on port 443, making them indistinguishable from normal web traffic.",
            "It bypasses operating system firewalls by running entirely in CPU cache memory.",
            "It replaces IP addresses with MAC addresses."
          ],
          correct: 1,
          explanation: "DoH hides DNS traffic inside HTTPS, preventing legacy firewalls and DPI sensors from inspecting domain name queries in cleartext."
        }
      ];

      // ---------- STATE ----------
      // each question: selected option index (null if none), revealed boolean
      let userState = questions.map(() => ({ selected: null, revealed: false }));

      // DOM elements
      const quizRoot = document.getElementById('quiz-root');
      const answeredCountSpan = document.getElementById('answered-count');
      const scoreDisplay = document.getElementById('score-display');

      // ---------- RENDER ----------
      function renderAll() {
        quizRoot.innerHTML = '';
        questions.forEach((q, idx) => {
          const card = document.createElement('div');
          card.className = 'question-card';
          card.dataset.qIndex = idx;

          // header
          const qHeader = document.createElement('div');
          qHeader.className = 'q-header';
          const qNum = document.createElement('div');
          qNum.className = 'q-num';
          qNum.textContent = `${idx + 1}`;
          const qText = document.createElement('div');
          qText.className = 'q-text';
          qText.textContent = q.question;
          qHeader.appendChild(qNum);
          qHeader.appendChild(qText);
          card.appendChild(qHeader);

          // options container
          const optionsContainer = document.createElement('div');
          optionsContainer.className = 'options';

          q.options.forEach((optText, optIdx) => {
            const optDiv = document.createElement('div');
            optDiv.className = 'option';
            if (userState[idx].revealed && userState[idx].selected !== null) {
              // reveal styling
              if (optIdx === q.correct) {
                optDiv.classList.add('correct');
              } else if (optIdx === userState[idx].selected) {
                optDiv.classList.add('wrong');
              }
            } else if (userState[idx].selected === optIdx) {
              optDiv.classList.add('selected');
            }

            const letter = document.createElement('span');
            letter.className = 'option-letter';
            letter.textContent = String.fromCharCode(65 + optIdx); // A,B,C,D

            const textSpan = document.createElement('span');
            textSpan.textContent = optText;

            optDiv.appendChild(letter);
            optDiv.appendChild(textSpan);

            // click handler
            optDiv.addEventListener('click', (e) => {
              e.stopPropagation();
              // if already revealed, ignore further clicks on this question
              if (userState[idx].revealed) return;

              // select this option & reveal
              userState[idx].selected = optIdx;
              userState[idx].revealed = true;
              // re-render that specific card only (to keep performance, but re-render all is fine)
              renderAll();
              updateStats();
            });

            optionsContainer.appendChild(optDiv);
          });

          card.appendChild(optionsContainer);

          // feedback / explanation block
          if (userState[idx].revealed) {
            const feedback = document.createElement('div');
            feedback.className = 'feedback show';
            const isCorrect = userState[idx].selected === q.correct;
            if (isCorrect) {
              feedback.classList.add('correct-fb');
            } else {
              feedback.classList.add('wrong-fb');
            }

            const mainMsg = document.createElement('div');
            if (isCorrect) {
              mainMsg.innerHTML = '<strong>✅ Correct!</strong>';
            } else {
              const correctLetter = String.fromCharCode(65 + q.correct);
              const chosenLetter = String.fromCharCode(65 + userState[idx].selected);
              mainMsg.innerHTML = `<strong>❌ Incorrect.</strong> Correct answer: ${correctLetter}`;
            }

            const expDiv = document.createElement('div');
            expDiv.className = 'explanation';
            expDiv.textContent = q.explanation;

            feedback.appendChild(mainMsg);
            feedback.appendChild(expDiv);
            card.appendChild(feedback);
          }

          quizRoot.appendChild(card);
        });

        updateStats();
      }

      // ---------- UPDATE STATS ----------
      function updateStats() {
        const answered = userState.filter(s => s.revealed).length;
        const correct = userState.reduce((acc, s, idx) => {
          return acc + (s.revealed && s.selected === questions[idx].correct ? 1 : 0);
        }, 0);

        answeredCountSpan.textContent = answered;
        scoreDisplay.textContent = `✅ ${correct} correct`;
        // optional: if all answered, you can show extra, but keep it simple
      }

      // ---------- RESET ----------
      function resetQuiz() {
        userState = questions.map(() => ({ selected: null, revealed: false }));
        renderAll();
        // update stats via renderAll (it calls updateStats)
      }

      // ---------- INITIAL RENDER ----------
      renderAll();

      // reset button
      document.getElementById('resetBtn').addEventListener('click', resetQuiz);

      // add touch-friendly optimizations
      window.addEventListener('load', () => {
        // no extra needed
      });

    })();
  </script>
</body>
</html>
