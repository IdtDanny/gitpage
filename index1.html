<!DOCTYPE html>
<html lang="en">
    <!-- Cyber Questions for Revision -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybersecurity Study & Quiz Hub</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #cbd5e1;
            --success: #22c55e;
            --error: #ef4444;
            --accent: #0284c7;
            --subtext: #64748b;
        }

        [data-theme="dark"] {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f1f5f9;
            --border: #334155;
            --success: #10b981;
            --error: #f43f5e;
            --accent: #38bdf8;
            --subtext: #94a3b8;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }
        .container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
            position: relative;
            transition: background 0.3s;
        }
        header-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        h1 { font-size: 1.5rem; margin: 0; color: var(--primary); text-align: center; flex-grow: 1; }
        .subtitle { text-align: center; color: var(--subtext); font-size: 0.9rem; margin-bottom: 25px; }
        
        .theme-toggle {
            background: none;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            position: absolute;
            top: 25px;
            right: 25px;
        }
        .theme-toggle:hover { background: var(--border); }

        /* Menu Selectors */
        .menu-section { display: flex; flex-direction: column; gap: 15px; }
        .menu-group { background: var(--bg); padding: 20px; border-radius: 10px; border: 1px solid var(--border); }
        .menu-group h3 { margin-top: 0; font-size: 1.1rem; color: var(--text); }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        
        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            font-size: 0.95rem;
        }
        button:hover { background: var(--primary-hover); }
        button.secondary { background: var(--subtext); }
        button.secondary:hover { background: #475569; }
        button.accent { background: var(--accent); grid-column: span 2; }
        button.accent:hover { background: #0284c7; }
        button.back-btn { background: var(--border); color: var(--text); margin-bottom: 15px; padding: 8px 14px; font-size: 0.85rem; }
        button.back-btn:hover { background: var(--subtext); color: white; }

        /* Rephraser Toggle Bar */
        .rephrase-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg);
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 15px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--subtext);
            flex-wrap: wrap;
            gap: 8px;
        }
        .rephrase-buttons { display: flex; gap: 6px; }
        .rephrase-btn {
            background: var(--border);
            color: var(--text);
            padding: 5px 10px;
            font-size: 0.8rem;
            border-radius: 6px;
        }
        .rephrase-btn.active {
            background: var(--accent);
            color: white;
        }
        
        /* Flashcard Styles */
        .flashcard {
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: pointer;
            margin-bottom: 20px;
            position: relative;
        }
        .flashcard .side-label {
            position: absolute;
            top: 12px;
            left: 15px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--subtext);
            font-weight: bold;
        }

        /* Quiz Styles */
        .question-box {
            margin-bottom: 20px;
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.5;
            padding: 15px;
            background: var(--bg);
            border-left: 4px solid var(--accent);
            border-radius: 4px;
        }
        .options-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .option-btn {
            background: var(--card-bg);
            color: var(--text);
            border: 1px solid var(--border);
            text-align: left;
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .option-btn:hover { background: var(--bg); border-color: var(--primary); }
        .option-btn.correct { background: rgba(34, 197, 94, 0.15); border-color: var(--success); color: var(--success); font-weight: bold; }
        .option-btn.incorrect { background: rgba(239, 68, 68, 0.15); border-color: var(--error); color: var(--error); }

        .nav-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
        .scorecard { text-align: center; }
        .scorecard h2 { font-size: 2rem; color: var(--success); margin: 10px 0; }

        /* Responsive Design */
        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 15px; }
            .btn-grid { grid-template-columns: 1fr; }
            button.accent { grid-column: span 1; }
            .theme-toggle { position: static; margin-bottom: 15px; width: 100%; }
            h1 { font-size: 1.25rem; }
        }
    </style>
</head>

            { original: "Why is establishing a baseline of normal processes and services useful for incident detection?", options: ["It guarantees that every alert represents an incident", "It prevents all malware from executing", "It makes unexpected processes and services easier to identify", "It eliminates the need for analysts"], answer: 2 },
            { original: "A SOC analyst notices a process with an unfamiliar name running on several workstations. What is the best initial conclusion?", options: ["Unknown processes can safely be ignored unless the firewall generates an alert", "The systems are definitely compromised", "The process should immediately be deleted from every machine", "The process is an incident candidate that requires investigation against expected system behaviour"], answer: 3 },
            { original: "Which email is most consistent with the phishing indicators discussed in the lecture?", options: ["A scheduled automated notification from an established internal system", "An urgent message from a misspelled domain requesting that the recipient open an unexpected attachment", "A previously expected document from a verified organizational address", "A routine internal message from a known colleague with no attachment"], answer: 1 },
            { original: "What distinguishes spear phishing from general phishing in the material?", options: ["Spear phishing is customized toward a particular individual or organization", "Spear phishing is always performed by an insider", "Spear phishing can only contain ransomware", "Spear phishing never uses email"], answer: 0 },
            { original: "A file server suddenly shows thousands of files being modified within several minutes. Why is this particularly important to the incident-response team?", options: ["High-volume file modification is a behavioural indicator associated with ransomware", "It is evidence of reconnaissance", "It proves that a backup is running", "It indicates that the firewall has failed"], answer: 0 },
            { original: "What is the principal security purpose of a honeypot in the ransomware-detection material?", options: ["To automatically decrypt ransomware-encrypted files", "To store the organization's only backup", "To attract malicious activity into a controlled environment where behaviour can be observed", "To replace the organization's firewall"], answer: 2 },
            { original: "Which observation would strengthen suspicion that widespread file modification is caused by ransomware?", options: ["A scheduled backup completed yesterday", "A user successfully authenticates using MFA", "Numerous files suddenly acquire unfamiliar extensions", "CPU usage remains at its normal baseline"], answer: 2 },
            { original: "Why should a honeypot be isolated from production systems?", options: ["Attackers can only detect non-isolated honeypots", "SIEM platforms cannot ingest honeypot logs", "Isolation makes it impossible to monitor", "Malicious activity in the honeypot should not be able to spread into production"], answer: 3 },
            { original: "Which statement best describes the role of backups in ransomware detection and response?", options: ["Backups eliminate the need for endpoint protection", "Backups primarily mitigate impact and support recovery rather than detect the attack", "Backups directly detect ransomware before execution", "Backups prevent phishing messages from being delivered"], answer: 1 },
            { original: "Why might an organization forward IDPS logs into a SIEM?", options: ["To replace all incident-response personnel", "To prevent endpoints from generating logs", "To make network traffic invisible to attackers", "To centrally analyze and correlate security events"], answer: 3 },
            { original: "A security manager wants to improve detection without overwhelming analysts with unnecessary alerts. Which approach is most consistent with the lecture?", options: ["Configure every rule at maximum sensitivity and never change it", "Investigate only incidents reported by users", "Disable alerts that have previously generated false positives", "Continuously tune detection rules while considering both false positives and false negatives"], answer: 3 },
            { original: "A SIEM receives an authentication failure from one server, a privilege-change event from another system, and unusual outbound traffic from a firewall. What is the main value of correlating these events?", options: ["Correlation eliminates the need to preserve original logs", "Correlation prevents false positives entirely", "Events from different sources may collectively reveal an incident that is less obvious when viewed separately", "Each event can be automatically assumed to be harmless"], answer: 2 },
            { original: "A SOC receives hundreds of low-value alerts every hour, and analysts routinely dismiss them without investigation. Which operational problem is most evident?", options: ["Weaponization", "Alert fatigue", "Site recovery", "Data exfiltration"], answer: 1 },
            { original: "Which sequence most closely reflects the IDS alert-handling workflow presented in the lecture?", options: ["Recover → scan → weaponize → contain", "Delete → rebuild → report → investigate", "Verify → classify severity → respond → document", "Escalate → ignore → archive → restore"], answer: 2 },
            { original: "A SOC observes a large volume of unexpected outbound traffic from an internal workstation during an off-peak period. Why should this receive attention?", options: ["Off-peak traffic is always prohibited", "High traffic necessarily means a denial-of-service attack against the workstation", "Unexpected internal traffic at unusual times can indicate data exfiltration or internal compromise", "Outbound traffic cannot be associated with an intrusion"], answer: 2 }
        ]
    };

    let selectedQuizKey = null;
    let selectedMode = null; // 'flashcard' or 'quiz'
    let currentIndex = 0;
    let score = 0;
    let consecutiveErrors = 0;
    let activeQuestions = [];
    let isFlipped = false;
    let selectedAnswer = null;
    let contextMode = 'original';

    function toggleTheme() {
        const body = document.body;
        const currentTheme = body.getAttribute('data-theme');
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';
        body.setAttribute('data-theme', newTheme);
        document.querySelector('.theme-toggle').textContent = newTheme === 'light' ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    function shuffle(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex !== 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    function renderMenu() {
        const area = document.getElementById('app-area');
        area.innerHTML = `
            <div class="menu-section">
                <div class="menu-group">
                    <h3>1. Choose Topic or Master Comprehensive Mode</h3>
                    <div class="btn-grid" style="margin-bottom: 12px;">
                        <button onclick="selectQuiz('infosec')">Infosec Basics (30 Qs)</button>
                        <button onclick="selectQuiz('dr')">Disaster Recovery (30 Qs)</button>
                        <button onclick="selectQuiz('ir')" style="grid-column: span 2;">Incident Response (50 Qs)</button>
                    </div>
                    <button class="accent" onclick="selectQuiz('all')">🚀 Master Comprehensive Mode (All 110 Shuffled Qs)</button>
                </div>
            </div>
        `;
    }

    function selectQuiz(quizKey) {
        selectedQuizKey = quizKey;
        renderModeMenu();
    }

    function renderModeMenu() {
        const area = document.getElementById('app-area');
        area.innerHTML = `
            <button class="back-btn" onclick="renderMenu()">← Back to Topics</button>
            <div class="menu-section">
                <div class="menu-group">
                    <h3>2. Choose Study Mode</h3>
                    <div class="btn-grid">
                        <button onclick="startSession('flashcard')">Flashcard Mode</button>
                        <button onclick="startSession('quiz')">Quiz Mode (Shuffled)</button>
                    </div>
                </div>
            </div>
        `;
    }

    function startSession(mode) {
        selectedMode = mode;
        currentIndex = 0;
        score = 0;
        consecutiveErrors = 0;

        if (selectedQuizKey === 'all') {
            activeQuestions = shuffle([...datasets.infosec, ...datasets.dr, ...datasets.ir]);
        } else {
            activeQuestions = shuffle([...datasets[selectedQuizKey]]);
        }
        render();
    }

    function setContextMode(mode) {
        contextMode = mode;
        render();
    }

    function getQuestionText(item) {
        if (contextMode === 'rephrased' && item.rephrased) {
            return item.rephrased;
        } else if (contextMode === 'conceptual' && item.conceptual) {
            return item.conceptual;
        }
        return item.original;
    }

    function renderRephraseBar() {
        return `
            <div class="rephrase-bar">
                <span>Wording Style:</span>
                <div class="rephrase-buttons">
                    <button class="rephrase-btn ${contextMode === 'original' ? 'active' : ''}" onclick="setContextMode('original')">Original</button>
                    <button class="rephrase-btn ${contextMode === 'rephrased' ? 'active' : ''}" onclick="setContextMode('rephrased')">Practical Context</button>
                    <button class="rephrase-btn ${contextMode === 'conceptual' ? 'active' : ''}" onclick="setContextMode('conceptual')">Concept Only</button>
                </div>
            </div>
        `;
    }

    function render() {
        const area = document.getElementById('app-area');
        if (currentIndex >= activeQuestions.length) {
            renderScorecard();
            return;
        }

        const item = activeQuestions[currentIndex];
        const qText = getQuestionText(item);

        if (selectedMode === 'flashcard') {
            area.innerHTML = `
                <button class="back-btn" onclick="renderModeMenu()">← Back to Modes</button>
                ${renderRephraseBar()}
                <div class="flashcard" onclick="toggleFlip()">
                    <div class="side-label">${isFlipped ? 'Answer' : 'Question (Click card to reveal)'}</div>
                    <div style="font-size: 1.1rem; font-weight: 500;">
                        ${isFlipped ? '<strong>Correct Answer:</strong><br><br>' + item.options[item.answer] : qText}
                    </div>
                </div>
                <div class="nav-controls">
                    <button class="secondary" onclick="prevCard()">Previous</button>
                    <span>Card ${currentIndex + 1} of ${activeQuestions.length}</span>
                    <button onclick="nextCard()">Next</button>
                </div>
            `;
        } else if (selectedMode === 'quiz') {
            let optionsHTML = '';
            item.options.forEach((opt, idx) => {
                optionsHTML += `<button class="option-btn" id="opt-${idx}" onclick="selectQuizAnswer(${idx})">${String.fromCharCode(65 + idx)}. ${opt}</button>`;
            });

            area.innerHTML = `
                <button class="back-btn" onclick="renderModeMenu()">← Back to Modes</button>
                ${renderRephraseBar()}
                <div style="font-size: 0.85rem; color: var(--subtext); margin-bottom: 10px;">Question ${currentIndex + 1} of ${activeQuestions.length} | Consecutive Errors: ${consecutiveErrors}/5</div>
                <div class="question-box">${qText}</div>
                <div class="options-list">${optionsHTML}</div>
                <div class="nav-controls" id="quiz-nav" style="display: none;">
                    <button onclick="nextQuizQuestion()">Next Question</button>
                </div>
            `;
            selectedAnswer = null;
        }
    }

    function toggleFlip() {
        isFlipped = !isFlipped;
        render();
    }

    function nextCard() {
        isFlipped = false;
        if (currentIndex < activeQuestions.length - 1) {
            currentIndex++;
            render();
        } else {
            alert("You've reached the end of the deck!");
        }
    }

    function prevCard() {
        isFlipped = false;
        if (currentIndex > 0) {
            currentIndex--;
            render();
        }
    }

    function selectQuizAnswer(selectedIdx) {
        if (selectedAnswer !== null) return;
        selectedAnswer = selectedIdx;
        const item = activeQuestions[currentIndex];

        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach((btn, idx) => {
            btn.disabled = true;
            if (idx === item.answer) {
                btn.classList.add('correct');
            } else if (idx === selectedIdx) {
                btn.classList.add('incorrect');
            }
        });

        if (selectedIdx === item.answer) {
            score++;
            consecutiveErrors = 0; // Reset on correct answer
        } else {
            consecutiveErrors++;
        }

        // Check Early Failure Rule: 5 errors in a row OR failing too early before midpoint
        const midPoint = Math.floor(activeQuestions.length / 2);
        const currentFailedCount = (currentIndex + 1) - score;

        if (consecutiveErrors >= 5 || (currentIndex < midPoint && currentFailedCount >= (midPoint / 2) + 1 && currentIndex >= 4)) {
            setTimeout(() => renderEarlyFailState(), 800);
            return;
        }

        document.getElementById('quiz-nav').style.display = 'flex';
    }

    function nextQuizQuestion() {
        currentIndex++;
        render();
    }

    function renderEarlyFailState() {
        const area = document.getElementById('app-area');
        area.innerHTML = `
            <div class="scorecard">
                <h2 style="color: var(--error);">Test Terminated (Early Fail) ⚠️</h2>
                <p>You triggered an early failure condition (either 5 consecutive incorrect answers or too many mistakes before reaching the mid-test point).</p>
                <p>Please review your material and restart.</p>
                <br>
                <div style="display: flex; gap: 10px; justify-content: center;">
                    <button onclick="startSession(selectedMode)">Restart & Reshuffle</button>
                    <button class="secondary" onclick="renderMenu()">Choose Topic</button>
                </div>
            </div>
        `;
    }

    function renderScorecard() {
        const area = document.getElementById('app-area');
        const percentage = Math.round((score / activeQuestions.length) * 100);
        const passed = percentage >= 70;
        area.innerHTML = `
            <div class="scorecard">
                <h2>${passed ? 'Quiz Complete! 🎉' : 'Quiz Failed ❌'}</h2>
                <p>Your Final Score:</p>
                <h1 style="font-size: 3rem; margin: 10px 0;">${score} / ${activeQuestions.length}</h1>
                <p style="font-size: 1.2rem; font-weight: bold; color: ${passed ? 'var(--success)' : 'var(--error)'};">Grade: ${percentage}% (${passed ? 'Passed' : 'Failed'})</p>
                <br>
                <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
                    <button onclick="startSession(selectedMode)">Retake & Reshuffle</button>
                    <button class="secondary" onclick="renderMenu()">Choose Another Topic</button>
                </div>
            </div>
        `;
    }

    // Initialize App Menu
    renderMenu();
</script>

</body>
</html>
